[project]
name = "sena-ai"
version = "0.1.0"
description = "Sena AI/ML Backend — workspace root"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "structlog>=24.1.0",
    "pydantic>=2.6.0",
    "cachetools>=5.3.0",
]

[tool.setuptools.packages.find]
exclude = ["migrations*", "tests*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["shared/src", "services/*/src"]
# Auto-generated prompt modules (md->py): byte-exact constants — must NOT be
# linted or formatted (ruff would strip semantically-significant trailing
# whitespace / wrap long prose, drifting the prompt). Edit the .py directly.
extend-exclude = [
    "services/onboarding/prompts",
    "services/case_review/voice/prompts",
    "services/case_review/prompts",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["sena_common", "ocr", "rag"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "shared/src:services/ocr/src:services/rag/src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["shared/tests", "services/ocr/tests", "services/rag/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
