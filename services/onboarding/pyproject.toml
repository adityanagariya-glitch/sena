[project]
name = "sena-onboarding"
version = "0.1.0"
description = "SENA Voice Onboarding API Service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "pydantic-settings==2.7.0",
  "redis[hiredis]==5.2.1",
  "httpx==0.28.1",
  "structlog==24.4.0",
  "orjson==3.10.12",
  "google-genai>=1.10.0",
  "sena-common",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "anyio==4.7.0",
  "ruff==0.8.4",
  "mypy==1.13.0",
  "fakeredis[aioredis]==2.26.2",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
