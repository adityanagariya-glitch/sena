map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name dev-api.isena.org;

    access_log /var/log/nginx/dev-api.isena.org_access.log;
    error_log  /var/log/nginx/dev-api.isena.org_error.log;

    # Main platform app (non-SENA-AI — reaches host via host.docker.internal)
    location / {
        proxy_pass http://host.docker.internal:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Voice — case note dictation (sena-voice:8000)
    location /voice/ {
        proxy_pass http://sena-voice:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Onboarding — Gemini Live voice (sena-onboarding:8001) — REST + WebSocket
    location /onboarding/ {
        proxy_pass http://sena-onboarding:8001/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        client_max_body_size 6m;
    }

    # Casenote Monthly — NDIS report generator (sena-casenote-monthly:8004)
    # Long timeout: 7 Bedrock sections run sequentially, can take 60-120s
    location /casenote/ {
        proxy_pass http://sena-casenote-monthly:8004/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1000s;
        proxy_send_timeout 1000s;
    }

    # Restrictive practices (restrictive_practices-api-1:8084)
    # Requires the external container to be on sena-network:
    #   docker network connect sena-network restrictive_practices-api-1
    location /practices/ {
        proxy_pass http://restrictive_practices-api-1:8084/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Case review — pgvector intelligence (sena-case-review:8002)
    location /case-review/ {
        proxy_pass http://sena-case-review:8002/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # AI Communication Log — Bedrock classifier (sena-ai-communication-log:8005)
    location /ai-comm-log/ {
        proxy_pass http://sena-ai-communication-log:8005/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # AI Chatbot gateway — staff + policy (sena-ai-chatbot:8003) — REST + WebSocket
    location /chatbot/ {
        proxy_pass http://sena-ai-chatbot:8003/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/dev-api.isena.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev-api.isena.org/privkey.pem;   # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;               # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                     # managed by Certbot
}

server {
    if ($host = dev-api.isena.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name dev-api.isena.org;
    return 404; # managed by Certbot
}
