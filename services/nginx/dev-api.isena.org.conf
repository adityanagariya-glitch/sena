        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Doc Service — policy/procedure doc upload + KB ingestion (sena-doc-service-internal:8010)
    location /doc-service/ {
        proxy_pass http://sena-doc-service-internal:8010/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    # Shift Summary — summary consolidation (sena-shift-summary-internal:8006)
    location /shift-summary/ {
        proxy_pass http://sena-shift-summary-internal:8006/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── TESTING SERVICES (9000+ range) ──────────────────────────────────────────
    # Onboarding Testing — Gemini Live voice (sena-onboarding-testing-internal:9001)
    location /onboarding-testing/ {
        proxy_pass http://sena-onboarding-testing-internal:9001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        client_max_body_size 6m;
    }

    # Casenote Testing — Case review RP-detection (sena-casenote-testing-internal:9002)
    location /casenote-testing/ {
        proxy_pass http://sena-casenote-testing-internal:9002/;
        proxy_http_version 1.1;
