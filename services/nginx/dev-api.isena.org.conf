map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# Uptime Kuma — server monitoring dashboard.
# Uptime Kuma does NOT support sub-path deployment (its SPA always redirects to
# absolute root paths like /dashboard), so it gets its OWN dedicated port and is
# served at root. The nginx container publishes 3001; the app stays internal.
# Access: http://3.111.109.14:3001/
server {
    listen 3001;
    server_name _;

    location / {
        proxy_pass http://uptime-kuma:3001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 180s;
    }
}

server {
    server_name dev-api.isena.org;

    access_log /var/log/nginx/dev-api.isena.org_access.log;
    error_log  /var/log/nginx/dev-api.isena.org_error.log;

    # Fix Swagger/ReDoc behind the path-strip proxy: rewrite the absolute spec URL
    # to a RELATIVE one so the browser fetches /<svc>/openapi.json (not /openapi.json,
    # which 404s). Only text/html is scanned — SSE (text/event-stream) and JSON are
    # untouched, so streaming/APIs are unaffected. One rule covers every service.
    sub_filter "url: '/openapi.json'"     "url: 'openapi.json'";
    sub_filter 'spec-url="/openapi.json"' 'spec-url="openapi.json"';
    sub_filter_once on;

    # Main platform app (non-SENA-AI — reaches host via host.docker.internal)
    location / {
        proxy_pass http://host.docker.internal:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Voice — case note dictation (sena-voice-internal:8008)
    # Long audio (30 min) can take 2-3 min to process; set timeout to 5 min.
    location /voice/ {
        proxy_pass http://sena-voice-internal:8008/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Onboarding — Gemini Live voice (sena-onboarding-internal:8009) — REST + WebSocket
    location /onboarding/ {
        proxy_pass http://sena-onboarding-internal:8009/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        client_max_body_size 6m;
    }

    # ──────────────────────────────────────────────────────────────────────
    # TESTING ROUTES — Isolated testing instances (do not affect production)
    # ──────────────────────────────────────────────────────────────────────

    # Voice Testing — isolated from production (sena-voice-internal-testing:8008)
    location /voice-testing/ {
        proxy_pass http://sena-voice-internal-testing:8008/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Onboarding Testing — isolated from production (sena-onboarding-internal-testing:8009)
    location /onboarding-testing/ {
        proxy_pass http://sena-onboarding-internal-testing:8009/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        client_max_body_size 6m;
    }

    # Casenote Monthly — NDIS report generator (sena-casenote-monthly:8004)
    # Long timeout: 7 Bedrock sections run sequentially, can take 60-120s
    location /casenote/ {
        proxy_pass http://sena-casenote-monthly-internal:8004/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1000s;
        proxy_send_timeout 1000s;
        client_max_body_size 10m;
    }

    # Restrictive practices (restrictive_practices-api-1:8084)
    # Requires the external container to be on sena-network:
    #   docker network connect sena-network restrictive_practices-api-1
    #
    # Resolved at REQUEST time (Docker DNS 127.0.0.11 + a variable upstream) so
    # nginx still STARTS even when this external container is absent. A *static*
    # hostname is resolved at boot and nginx dies with "host not found in
    # upstream" if it's missing — which would take down EVERY route, including
    # /ai-chatbot/. With the variable, a missing container only makes /practices/
    # return 502; everything else keeps serving. The `rewrite` reproduces the
    # prefix-stripping the trailing slash on a static proxy_pass used to do.
    location /practices/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $practices_upstream restrictive_practices-api-1;
        rewrite ^/practices/(.*)$ /$1 break;
        proxy_pass http://$practices_upstream:8084;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Case review — RP-detection + voice pipeline (sena-case-review:8002) — REST + WebSocket
    # WS endpoint: /case-review/v1/restrictive-practices/voice/ws/{session_id}
    location /case-review/ {
        proxy_pass http://sena-case-review-internal:8002/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 10m;
    }

    # Restrictive practices API routes (integrated into case-review service)
    # Must be a separate block because the path prefix doesn't start with /case-review/
    location /v1/restrictive-practices/ {
        proxy_pass http://sena-case-review-internal:8002/v1/restrictive-practices/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 50m;
    }

    # AI Communication Log — Bedrock classifier (sena-ai-communication-log:8005)
    location /ai-comm-log/ {
        proxy_pass http://sena-ai-communication-log-internal:8005/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # AI Text Extraction — identity-document field extraction via Bedrock (sena-ai-text-extraction:8007)
    # Longer timeout: S3 fetch + PDF rasterisation + Bedrock Nova Lite call.
    location /text-extraction/ {
        proxy_pass http://sena-ai-text-extraction-internal:8007/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # AI Chatbot gateway — staff + policy (sena-ai-chatbot:8003) — REST + SSE + WebSocket
    location /ai-chatbot/ {
        proxy_pass http://sena-ai-chatbot-internal:8003;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream Server-Sent Events in real time — never buffer/cache the response.
        # (The gateway also sets X-Accel-Buffering: no per SSE response.)
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 180s;
    }

    # Shift Summary — summary consolidation (sena-shift-summary:8006)
    location /shift-summary/ {
        proxy_pass http://sena-shift-summary-internal:8006/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Policy — policy & procedures via Bedrock (sena-policy-proc-internal:8000)
    location /policy/ {
        proxy_pass http://sena-policy-proc-internal:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Staff — shifts & client information (sena-staff-internal:8001)
    location /staff/ {
        proxy_pass http://sena-staff-internal:8001/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Case-Review Streamlit UI — containerised (sena-case-review-ui-internal:8501).
    # Served at https://dev-api.isena.org/case-review-ui/ — TLS, port 443, behind Certbot.
    # No trailing slash on proxy_pass (preserves the /case-review-ui/ baseUrlPath prefix).
    location /case-review-ui/ {
        proxy_pass http://sena-case-review-ui-internal:8501;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/dev-api.isena.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev-api.isena.org/privkey.pem;   # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;               # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                     # managed by Certbot
}

server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 _;

    # Fix Swagger/ReDoc behind the path-strip proxy (see the :443 block above for
    # the full explanation). Rewrites the spec URL to relative; text/html only.
    sub_filter "url: '/openapi.json'"     "url: 'openapi.json'";
    sub_filter 'spec-url="/openapi.json"' 'spec-url="openapi.json"';
    sub_filter_once on;

    # Local docker-compose access: http://localhost:8080/ai-chatbot/...
    # The HTTPS dev-api server above has the production ai-chatbot location, but
    # localhost:8080 lands on port 80 and used to hit Certbot's fallback 404.
    location /ai-chatbot/ {
        proxy_pass http://sena-ai-chatbot-internal:8003;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 180s;
    }

    # Policy — policy & procedures (localhost dev access)
    location /policy/ {
        proxy_pass http://sena-policy-proc-internal:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Staff — shifts & client information (localhost dev access)
    location /staff/ {
        proxy_pass http://sena-staff-internal:8001/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Case review — RP-detection + voice pipeline (sena-case-review-internal:8002) — REST + WebSocket
    # Local / tunnel access:  http://localhost:8080/case-review/v1/restrictive-practices/...
    # WS:  ws(s)://<host>/case-review/v1/restrictive-practices/voice/ws/{session_id}?token=...
    location /case-review/ {
        proxy_pass http://sena-case-review-internal:8002/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 10m;
    }

    # Case-Review Streamlit UI — containerised (sena-case-review-ui-internal:8501).
    # Streamlit runs with --server.baseUrlPath=case-review-ui, so the prefix is PRESERVED
    # (no trailing slash on proxy_pass). WebSocket upgrade is required for Streamlit's live stream.
    # Public URL: http://<host>:8080/case-review-ui/
    location /case-review-ui/ {
        proxy_pass http://sena-case-review-ui-internal:8501;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Voice — case note dictation (sena-voice-internal:8008)
    # Long audio (30 min) can take 2-3 min to process; set timeout to 5 min.
    location /voice/ {
        proxy_pass http://sena-voice-internal:8008/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Onboarding — Gemini Live voice (sena-onboarding-internal:8009) — REST + WebSocket
    location /onboarding/ {
        proxy_pass http://sena-onboarding-internal:8009/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        client_max_body_size 6m;
    }

    # Voice Testing (localhost:8080 dev access)
    location /voice-testing/ {
        proxy_pass http://sena-voice-internal-testing:8008/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Onboarding Testing (localhost:8080 dev access)
    location /onboarding-testing/ {
        proxy_pass http://sena-onboarding-internal-testing:8009/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        client_max_body_size 6m;
    }

    # Casenote Monthly — NDIS report generator (sena-casenote-monthly-internal:8004)
    location /casenote/ {
        proxy_pass http://sena-casenote-monthly-internal:8004/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1000s;
        proxy_send_timeout 1000s;
        client_max_body_size 10m;
    }

    # AI Communication Log — Bedrock classifier (sena-ai-communication-log-internal:8005)
    location /ai-comm-log/ {
        proxy_pass http://sena-ai-communication-log-internal:8005/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # AI Text Extraction — identity-document field extraction (sena-ai-text-extraction-internal:8007)
    location /text-extraction/ {
        proxy_pass http://sena-ai-text-extraction-internal:8007/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Shift Summary — summary consolidation (sena-shift-summary-internal:8006)
    location /shift-summary/ {
        proxy_pass http://sena-shift-summary-internal:8006/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}

server {
    if ($host = dev-api.isena.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name dev-api.isena.org;
    return 404; # managed by Certbot
}
