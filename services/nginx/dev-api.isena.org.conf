    # Voice Testing — Case note dictation (sena-voice-testing-internal:9003)
    location /voice-testing/ {
        proxy_pass http://sena-voice-testing-internal:9003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
