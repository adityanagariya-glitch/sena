map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;

    # ── Voice (port 8082) ─────────────────────────────────────────────────────
    # Strips /voice/ prefix — service sees /v1/voice/... (matches production pattern)
    location /voice/ {
        proxy_pass http://host.docker.internal:8082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Onboarding REST + WS (port 8083) ─────────────────────────────────────
    # Strips /onboarding/ prefix — service sees /v1/onboarding/... and /ws/onboarding/...
    location /onboarding/ {
        proxy_pass http://host.docker.internal:8083/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Case Review REST + WS (port 8084) ────────────────────────────────────
    # Strips /case-review/ prefix — service sees /v1/case-review/... and /ws/case-review/...
    location /case-review/ {
        proxy_pass http://host.docker.internal:8084/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 10m;
    }

    location / {
        return 404;
    }
}
