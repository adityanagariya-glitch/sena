# Local dev only — infrastructure containers.
# App services (voice, onboarding, case_review, etc.) run via uvicorn on the host.
#
# Start:  cd services && docker-compose up -d
# Stop:   cd services && docker-compose down
#
# One-time hosts file setup (admin PS):
#   Add-Content C:\Windows\System32\drivers\etc\hosts "127.0.0.1 ai-db"
#   Add-Content C:\Windows\System32\drivers\etc\hosts "127.0.0.2 shared-db"

name: sena-ai-local

services:

  # ai-db: bound to 127.0.0.1 so shared-db can use 127.0.0.2 on the same ports
  ai-db-internal:
    image: pgvector/pgvector:pg16
    container_name: sena-ai-db-local
    environment:
      POSTGRES_USER: sena_ai
      POSTGRES_PASSWORD: sena_ai
      POSTGRES_DB: sena_ai
    ports:
      - "127.0.0.1:5432:5432"   # voice:        AI_DB_URL=...@ai-db:5432
      - "127.0.0.1:5433:5432"   # case_review:  SENA_AI_AI_DB_URL=...@localhost:5433
    volumes:
      - ai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sena_ai -d sena_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # shared-db: bound to 127.0.0.2 — avoids port collision with ai-db
  shared-db-internal:
    image: postgres:16-alpine
    container_name: sena-shared-db-local
    command: ["postgres", "-p", "5432"]
    environment:
      POSTGRES_USER: shared
      POSTGRES_PASSWORD: shared
      POSTGRES_DB: platform
    ports:
      - "127.0.0.2:5432:5432"   # voice: SHARED_DB_URL=...@shared-db:5432
    volumes:
      - shared-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shared -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ai-db-data:
  shared-db-data:
