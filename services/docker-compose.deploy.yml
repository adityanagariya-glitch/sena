version: "3.9"

# Unified internal-testing stack for all SENA AI services.
#
# Runs ALONGSIDE the existing client-facing stack on the same host.
# Everything here is namespaced (project name + "-internal" container names
# + 9000-range host ports + dedicated volumes) so NOTHING collides with the
# already-running services:
#   old host ports in use : 8082 (voice) 8083 (onboarding) 8084 (restrictive) 5433 5434
#   old container names    : sena-voice sena-onboarding sena-redis sena-ai-db sena-shared-db
#
# This stack: own isolated Redis + Postgres (separate volumes) — zero risk to client data.
#
# Run from repo root:
#   docker compose -f services/docker-compose.deploy.yml up --build -d
# Build a single service:
#   docker compose -f services/docker-compose.deploy.yml up --build sena-voice
# Tear down (keeps volumes):
#   docker compose -f services/docker-compose.deploy.yml down

name: sena-ai-internal

services:
  sena-voice:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: voice
    container_name: sena-voice-internal
    env_file:
      - .env
    environment:
      SENA_AI_REDIS_URL: redis://redis:6379/0
      SENA_AI_HOST: 0.0.0.0
    ports:
      - "9000:8000"
    depends_on:
      redis:
        condition: service_healthy
      ai-db:
        condition: service_healthy
      shared-db:
        condition: service_healthy
    restart: unless-stopped

  sena-onboarding:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: onboarding
    container_name: sena-onboarding-internal
    env_file:
      - .env
    environment:
      SENA_AI_REDIS_URL: redis://redis:6379/0
      SENA_AI_HOST: 0.0.0.0
      SENA_AI_ONBOARDING_PORT: "8001"
    ports:
      - "9001:8001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  sena-case-review:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: case-review
    container_name: sena-case-review-internal
    env_file:
      - .env
    environment:
      SENA_AI_HOST: 0.0.0.0
      SENA_AI_AI_DB_URL: postgresql+asyncpg://sena_ai:sena_ai@ai-db:5432/sena_ai
    ports:
      - "9002:8002"
    depends_on:
      ai-db:
        condition: service_healthy
    restart: unless-stopped

  sena-ai-chatbot:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: ai-chatbot
    container_name: sena-ai-chatbot-internal
    env_file:
      - .env
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "8003"
      CHILD_HOST: 127.0.0.1
      STAFF_DIR: /app/services/staff
      POLICY_DIR: /app/services/policy_proc
    ports:
      - "9003:8003"
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: sena-redis-internal
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ai-db:
    image: pgvector/pgvector:pg16
    container_name: sena-ai-db-internal
    environment:
      POSTGRES_USER: sena_ai
      POSTGRES_PASSWORD: sena_ai
      POSTGRES_DB: sena_ai
    volumes:
      - ai-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sena_ai -d sena_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  shared-db:
    image: postgres:16-alpine
    container_name: sena-shared-db-internal
    environment:
      POSTGRES_USER: shared
      POSTGRES_PASSWORD: shared
      POSTGRES_DB: platform
    volumes:
      - shared-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shared -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
  ai-db-data:
  shared-db-data:
