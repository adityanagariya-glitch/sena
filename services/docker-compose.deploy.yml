# Run from repo root:
#   docker compose -f services/docker-compose.deploy.yml up --build -d
#
# One-time setup — connect the already-running restrictive_practices container
# to sena-network so nginx can proxy /practices/ to it:
#   docker network connect sena-network restrictive_practices-api-1

name: sena-ai

services:

  # ── Public gateway — only container with host-exposed ports ───────────────
  sena-reverse-proxy:
    image: nginx:alpine
    container_name: sena-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dev-api.isena.org.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - sena-voice
      - sena-onboarding
      - sena-case-review
      - sena-casenote-monthly
      - sena-ai-chatbot
      - sena-ai-communication-log
      - sena-shift-summary
    networks:
      - sena-network
    restart: unless-stopped

  # ── App services — internal only, reachable via nginx ─────────────────────
  sena-voice:
    build:
      context: .
      dockerfile: Dockerfile
      target: voice
    container_name: sena-voice
    env_file:
      - ../.env
    environment:
      # Voice uses Field(alias=...) which bypasses env_prefix — no SENA_AI_ here
      REDIS_URL: redis://redis-internal:6379/0
      AI_DB_URL: postgresql+asyncpg://sena_ai:sena_ai@ai-db-internal:5432/sena_ai
      SHARED_DB_URL: postgresql+asyncpg://shared:shared@shared-db-internal:5432/platform
    expose:
      - "8000"
    depends_on:
      redis-internal:
        condition: service_healthy
      ai-db-internal:
        condition: service_healthy
      shared-db-internal:
        condition: service_healthy
    networks:
      - sena-network
    restart: unless-stopped

  sena-onboarding:
    build:
      context: .
      dockerfile: Dockerfile
      target: onboarding
    container_name: sena-onboarding
    env_file:
      - ../.env
    environment:
      SENA_AI_REDIS_URL: redis://redis-internal:6379/0
      SENA_AI_HOST: 0.0.0.0
      SENA_AI_ONBOARDING_PORT: "8001"
    expose:
      - "8001"
    depends_on:
      redis-internal:
        condition: service_healthy
    networks:
      - sena-network
    restart: unless-stopped

  sena-case-review:
    build:
      context: .
      dockerfile: Dockerfile
      target: case-review
    container_name: sena-case-review
    env_file:
      - ../.env
    environment:
      SENA_AI_HOST: 0.0.0.0
      SENA_AI_AI_DB_URL: postgresql+asyncpg://sena_ai:sena_ai@ai-db-internal:5432/sena_ai
    expose:
      - "8002"
    depends_on:
      ai-db-internal:
        condition: service_healthy
    networks:
      - sena-network
    restart: unless-stopped

  sena-casenote-monthly:
    build:
      context: .
      dockerfile: Dockerfile
      target: casenote-monthly
    container_name: sena-casenote-monthly
    env_file:
      - ../.env
    expose:
      - "8004"
    volumes:
      - casenote-reports:/app/reports
    networks:
      - sena-network
    restart: unless-stopped

  sena-ai-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
      target: ai-chatbot
    container_name: sena-ai-chatbot
    env_file:
      - ../.env
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "8003"
      CHILD_HOST: 127.0.0.1
      STAFF_DIR: /app/services/staff
      POLICY_DIR: /app/services/policy_proc
    expose:
      - "8003"
    networks:
      - sena-network
    restart: unless-stopped

  sena-ai-communication-log:
    build:
      context: .
      dockerfile: Dockerfile
      target: ai-communication-log
    container_name: sena-ai-communication-log
    env_file:
      - ../.env
    expose:
      - "8005"
    networks:
      - sena-network
    restart: unless-stopped

  sena-shift-summary:
    build:
      context: .
      dockerfile: Dockerfile
      target: shift-summary
    container_name: sena-shift-summary
    env_file:
      - ../.env
    expose:
      - "8006"
    networks:
      - sena-network
    restart: unless-stopped

  # ── Infrastructure ─────────────────────────────────────────────────────────
  redis-internal:
    image: redis:7.4-alpine
    container_name: sena-redis-internal
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sena-network
    restart: unless-stopped

  ai-db-internal:
    image: pgvector/pgvector:pg16
    container_name: sena-ai-db-internal
    environment:
      POSTGRES_USER: sena_ai
      POSTGRES_PASSWORD: sena_ai
      POSTGRES_DB: sena_ai
    volumes:
      - ai-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sena_ai -d sena_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sena-network
    restart: unless-stopped

  shared-db-internal:
    image: postgres:16-alpine
    container_name: sena-shared-db-internal
    environment:
      POSTGRES_USER: shared
      POSTGRES_PASSWORD: shared
      POSTGRES_DB: platform
    volumes:
      - shared-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shared -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sena-network
    restart: unless-stopped

networks:
  sena-network:
    driver: bridge

volumes:
  redis-data:
  ai-db-data:
  shared-db-data:
  casenote-reports:
