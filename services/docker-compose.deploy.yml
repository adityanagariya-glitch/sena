# Run from repo root:
#   docker compose -f services/docker-compose.deploy.yml up --build -d
#
# One-time setup — connect the already-running restrictive_practices container
# to sena-network so nginx can proxy /practices/ to it:
#   docker network connect sena-network restrictive_practices-api-1

name: sena-ai-internal

services:

  # ── Public gateway (TLS termination) — the ONLY container with host-published ports ───
  sena-reverse-proxy:
    image: nginx:alpine
    container_name: sena-reverse-proxy-internal
    ports:
      - "8080:80"
      - "8443:443"
      - "3001:3001"   # Uptime Kuma — served at root on its own port
    volumes:
      - ./nginx/dev-api.isena.org.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: []
    networks:
      - sena-network
    restart: unless-stopped

  # ── App services — internal only, reachable via nginx ─────────────────────
  sena-voice:
    build:
      context: .
      dockerfile: Dockerfile
      target: voice
    container_name: sena-voice-internal
    env_file:
      - ../.env
    environment:
      # Voice uses Field(alias=...) which bypasses env_prefix — no SENA_AI_ here
      REDIS_URL: redis://redis-internal:6979/0
      AI_DB_URL: postgresql+asyncpg://sena_ai:sena_ai@ai-db-internal:5432/sena_ai
      SHARED_DB_URL: postgresql+asyncpg://shared:shared@shared-db-internal:5433/platform
    expose:
      - "8008"
    depends_on:
      redis-internal:
        condition: service_healthy
      ai-db-internal:
        condition: service_healthy
      shared-db-internal:
        condition: service_healthy
    networks:
      - sena-network
    restart: unless-stopped

  sena-onboarding:
    build:
      context: .
      dockerfile: Dockerfile
      target: onboarding
    container_name: sena-onboarding-internal
    env_file:
      - ../.env
    environment:
      SENA_AI_REDIS_URL: redis://redis-internal:6979/0
      SENA_AI_HOST: 0.0.0.0
      SENA_AI_ONBOARDING_PORT: "8009"
    expose:
      - "8009"
    depends_on:
      redis-internal:
        condition: service_healthy
    networks:
      - sena-network
    restart: unless-stopped

  sena-case-review:
    build:
      context: .
      dockerfile: Dockerfile
      target: case-review
    container_name: sena-case-review-internal
    env_file:
      - ../.env
    environment:
      SENA_AI_AI_DB_URL: postgresql+asyncpg://sena_ai:sena_ai@ai-db-internal:5432/sena_ai
      SENA_AI_CASE_REVIEW_REDIS_URL: redis://redis-internal:6979/1
    expose:
      - "8002"
    depends_on:
      ai-db-internal:
        condition: service_healthy
      redis-internal:
        condition: service_healthy
    networks:
      - sena-network
    restart: unless-stopped

  sena-casenote-monthly:
    build:
      context: .
      dockerfile: Dockerfile
      target: casenote-monthly
    container_name: sena-casenote-monthly-internal
    env_file:
      - ../.env
    expose:
      - "8004"
    volumes:
      - casenote-reports:/app/reports
      - casenote-trends:/app/trends
    networks:
      - sena-network
    restart: unless-stopped

  sena-ai-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
      target: ai-chatbot
    container_name: sena-ai-chatbot-internal
    env_file:
      - ../.env
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "8003"
      # Network mode: the gateway talks to the standalone sena-staff /
      # sena-policy-proc containers over the docker network instead of spawning
      # them as child processes. No duplicate copies; each backend restarts,
      # logs and scales on its own. (run.sh still spawns children for local dev.)
      MANAGE_CHILDREN: "false"
      STAFF_ORIGIN: "http://sena-staff-internal:8001"
      POLICY_ORIGIN: "http://sena-policy-proc-internal:8000"
    expose:
      - "8003"
    depends_on:
      # Gate startup on both backends being HEALTHY (their /health probes), not
      # merely started — so the gateway never comes up pointing at a dead origin.
      sena-policy-proc:
        condition: service_healthy
      sena-staff:
        condition: service_healthy
    networks:
      - sena-network
    restart: unless-stopped

  sena-policy-proc:
    build:
      context: .
      dockerfile: Dockerfile
      target: policy-proc
    container_name: sena-policy-proc-internal
    env_file:
      - ../.env
    environment:
      SENA_AI_HOST: 0.0.0.0
      SENA_AI_POLICY_PROC_PORT: "8000"
    expose:
      - "8000"
    networks:
      - sena-network
    restart: unless-stopped

  sena-staff:
    build:
      context: .
      dockerfile: Dockerfile
      target: staff
    container_name: sena-staff-internal
    env_file:
      - ../.env
    environment:
      SENA_AI_HOST: 0.0.0.0
      SENA_AI_STAFF_PORT: "8001"
    expose:
      - "8001"
    networks:
      - sena-network
    restart: unless-stopped

  sena-ai-communication-log:
    build:
      context: .
      dockerfile: Dockerfile
      target: ai-communication-log
    container_name: sena-ai-communication-log-internal
    env_file:
      - ../.env
    expose:
      - "8005"
    networks:
      - sena-network
    restart: unless-stopped

  sena-shift-summary:
    build:
      context: .
      dockerfile: Dockerfile
      target: shift-summary
    container_name: sena-shift-summary-internal
    env_file:
      - ../.env
    expose:
      - "8006"
    networks:
      - sena-network
    restart: unless-stopped

  sena-ai-text-extraction:
    build:
      context: .
      dockerfile: Dockerfile
      target: ai-text-extraction
    container_name: sena-ai-text-extraction-internal
    env_file:
      - ../.env
    expose:
      - "8007"
    networks:
      - sena-network
    restart: unless-stopped

  sena-case-review-ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: case-review-ui
    container_name: sena-case-review-ui-internal
    env_file:
      - ../.env
    environment:
      # The Streamlit UI calls the case-review API directly over the docker network.
      SENA_TEST_BASE_URL: http://sena-case-review-internal:8002
    expose:
      - "8501"
    depends_on:
      - sena-case-review
    networks:
      - sena-network
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
      - uptime-kuma-data:/app/data
    expose:
      - "3001"
    environment:
      UPTIME_KUMA_URL: http://3.111.109.14:3001/
    networks:
      - sena-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 5

  # ── Infrastructure ─────────────────────────────────────────────────────────
  redis-internal:
    image: redis:7.4-alpine
    container_name: sena-redis-internal
    expose:
      - "6979"
    command: ["redis-server", "--appendonly", "yes", "--port", "6979"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6979", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sena-network
    restart: unless-stopped

  ai-db-internal:
    image: pgvector/pgvector:pg16
    container_name: sena-ai-db-internal
    environment:
      POSTGRES_USER: sena_ai
      POSTGRES_PASSWORD: sena_ai
      POSTGRES_DB: sena_ai
    volumes:
      - ai-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sena_ai -d sena_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sena-network
    restart: unless-stopped

  shared-db-internal:
    image: postgres:16-alpine
    container_name: sena-shared-db-internal
    # Listen on 5433 (not the default 5432) so it has a unique port distinct from
    # ai-db-internal. The only consumer is voice's SHARED_DB_URL (also :5433).
    command: ["postgres", "-p", "5433"]
    environment:
      POSTGRES_USER: shared
      POSTGRES_PASSWORD: shared
      POSTGRES_DB: platform
    volumes:
      - shared-db-data:/var/lib/postgresql/data
    expose:
      - "5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shared -d platform -p 5433"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sena-network
    restart: unless-stopped

networks:
  sena-network:
    driver: bridge

volumes:
  redis-data:
  ai-db-data:
  shared-db-data:
  casenote-reports:
  casenote-trends:
  uptime-kuma-data:
