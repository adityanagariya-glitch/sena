[project]
name = "sena-case-review"
version = "0.1.0"
description = "SENA Case Note Review & Intelligence Service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "httpx==0.28.1",
  "structlog==25.5.0",
  "orjson==3.10.12",
  "google-genai>=1.0.0",
  "redis[hiredis]==5.2.1",
  "sena-common",
  "boto3==1.35.80",
  "langgraph>=0.4.0",
  "langchain-text-splitters>=0.3.0",
  "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "anyio==4.7.0",
  "ruff==0.8.4",
  "mypy==1.13.0",
  "aiosqlite==0.20.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
