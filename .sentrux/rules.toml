# Sentrux architectural rules for SENA AI backend
# Enforces the layered dependency direction: api → services → repositories → models
# Run: sentrux check .   (CI gate — exits 1 on violation)
# Run: sentrux gate --save .  (before an agent session)
# Run: sentrux gate .         (after — catches any degradation)

[constraints]
max_cycles      = 0       # zero circular dependencies — hard block
max_coupling    = "B"     # module coupling grade (A=best, F=worst)
max_cc          = 25      # max cyclomatic complexity per function
no_god_files    = true    # flag any file that touches everything

# ── Shared library (foundation — nothing may depend on services above it) ──────
[[layers]]
name  = "shared"
paths = [
  "services/shared/**",
]
order = 0

# ── Data models (Pydantic / SQLAlchemy ORM — pure, no IO) ─────────────────────
[[layers]]
name  = "models"
paths = [
  "services/*/src/*/models/**",
]
order = 1

# ── Repositories (Redis + Postgres access — depends only on models + shared) ───
[[layers]]
name  = "repositories"
paths = [
  "services/*/src/*/repositories/**",
]
order = 2

# ── Business-logic services (validators, prompt builders, Gemini bridge, etc.) ─
[[layers]]
name  = "services"
paths = [
  "services/*/src/*/services/**",
  "services/*/src/*/clients/**",
]
order = 3

# ── API surface (FastAPI routes + deps — may import any layer below) ───────────
[[layers]]
name  = "api"
paths = [
  "services/*/src/*/api/**",
]
order = 4
