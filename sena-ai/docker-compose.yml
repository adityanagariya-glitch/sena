services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sena_ai
      POSTGRES_USER: sena
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/setup_rls.sql:/docker-entrypoint-initdb.d/02-rls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sena -d sena_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  ocr-service:
    build:
      context: .
      dockerfile: services/ocr/Dockerfile
    environment:
      SENA_DATABASE_URL: postgresql+asyncpg://sena_app:localdev@postgres:5432/sena_ai
      SENA_ENVIRONMENT: development
      SENA_LOG_LEVEL: DEBUG
    ports:
      - "8001:8000"
    volumes:
      - ./services/ocr/src:/app/src
      - ./shared/src:/app/shared/src
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
