# Docker Compose Configuration
# Defines services and infrastructure for local development

## Services defined:
# 1. PostgreSQL (pgvector) - Vector-enabled database for the Sena AI platform
#    - Database: sena_ai
#    - User: sena / Password: localdev
#    - Port: 5432
#    - Runs initialization scripts: init_db.sql and setup_rls.sql
#    - Includes health checks to ensure service readiness
#    - Persistent volume for database data

# 2. OCR Service - FastAPI application for document OCR processing
#    - Built from services/ocr/Dockerfile
#    - Connected to PostgreSQL
#    - Port: 8001 (mapped to internal 8000)
#    - Environment variables set for development
#    - Volume mounts for live code reloading
#    - Depends on PostgreSQL being healthy

## Volumes:
# - pgdata: Persists PostgreSQL data between container restarts
