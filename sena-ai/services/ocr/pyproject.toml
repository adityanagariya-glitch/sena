[project]
name = "sena-ocr"
version = "0.1.0"
description = "Sena OCR Document Extraction Service"
requires-python = ">=3.12"
dependencies = [
    "sena-common",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
