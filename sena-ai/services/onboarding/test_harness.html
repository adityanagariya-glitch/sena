<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENA Voice Onboarding</title>
<style>
:root {
  --c-bg:       #080D1A;
  --c-surface:  #0F1629;
  --c-s2:       #172136;
  --c-s3:       #1E2D47;
  --c-border:   rgba(255,255,255,0.06);
  --c-primary:  #1D5FA8;
  --c-plight:   #2563EB;
  --c-green:    #22C55E;
  --c-purple:   #818CF8;
  --c-amber:    #F59E0B;
  --c-red:      #EF4444;
  --c-teal:     #1D9E75;
  --c-t1:       #F1F5F9;
  --c-t2:       #94A3B8;
  --c-t3:       #4B5563;
  --radius-sm:  8px;
  --radius-md:  12px;
  --radius-lg:  16px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; overflow:hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--c-bg);
  color: var(--c-t1);
  display: flex;
  flex-direction: column;
}

/* ── HEADER ───────────────────────────────────────────── */
.hdr {
  height: 56px;
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 14px;
  flex-shrink: 0;
  z-index: 10;
}
.logo-mark {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--c-primary), var(--c-plight));
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 15px; color: #fff; letter-spacing: -0.5px;
  box-shadow: 0 2px 12px rgba(37,99,235,0.4);
  flex-shrink: 0;
}
.logo-name { font-weight: 700; font-size: 0.95rem; color: var(--c-t1); }
.logo-sub  { font-size: 0.7rem;  color: var(--c-t3); }
.hdr-div   { width: 1px; height: 24px; background: var(--c-border); }
.step-pill {
  font-size: 0.7rem; color: var(--c-t2);
  background: var(--c-s3); padding: 3px 10px; border-radius: 20px;
  border: 1px solid var(--c-border);
}
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--c-t3);
  transition: background .3s, box-shadow .3s;
}
.status-dot.live        { background: var(--c-green);  box-shadow: 0 0 8px rgba(34,197,94,.6); }
.status-dot.speaking    { background: var(--c-purple); box-shadow: 0 0 8px rgba(129,140,248,.6); }
.status-dot.connecting  { background: var(--c-amber); animation: blink 1s infinite; }
.status-dot.error       { background: var(--c-red); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.status-label { font-size: 0.72rem; color: var(--c-t2); }

/* ── LAYOUT ───────────────────────────────────────────── */
.body {
  flex: 1;
  display: grid;
  grid-template-columns: 268px 1fr 308px;
  overflow: hidden;
}

/* ── LEFT SIDEBAR ─────────────────────────────────────── */
.left {
  background: var(--c-surface);
  border-right: 1px solid var(--c-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.s-section {
  padding: 16px;
  border-bottom: 1px solid var(--c-border);
}
.s-section.grow { flex: 1; overflow-y: auto; }
.s-section.grow::-webkit-scrollbar { width: 3px; }
.s-section.grow::-webkit-scrollbar-thumb { background: var(--c-s3); border-radius: 4px; }
.s-label {
  font-size: 0.63rem; text-transform: uppercase; letter-spacing: .09em;
  color: var(--c-t3); font-weight: 700; margin-bottom: 12px;
}
.f-group { margin-bottom: 10px; }
.f-group label { font-size: 0.72rem; color: var(--c-t2); display: block; margin-bottom: 4px; }
.f-group input, .f-group select {
  width: 100%; background: var(--c-s2); border: 1px solid var(--c-border);
  color: var(--c-t1); border-radius: var(--radius-sm); padding: 7px 10px;
  font-size: 0.78rem; outline: none; transition: border-color .2s;
  -webkit-appearance: none; appearance: none;
}
.f-group input:focus, .f-group select:focus { border-color: var(--c-primary); }

/* custom select arrow */
.sel-wrap { position: relative; }
.sel-wrap::after {
  content: ''; position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 5px solid var(--c-t3); pointer-events: none;
}
select option { background: #1a2540; }

.btn {
  width: 100%; padding: 9px 14px;
  border: none; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 0.78rem; font-weight: 600;
  transition: opacity .15s, transform .1s;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-success { background: var(--c-teal); color: #fff; }
.btn-ghost   { background: var(--c-s3); color: var(--c-t2); }
.btn-red     { background: rgba(239,68,68,.15); color: var(--c-red); border: 1px solid rgba(239,68,68,.25); }

.sid-chip {
  display: none;
  margin-top: 10px;
  background: var(--c-s2);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  gap: 8px;
  align-items: center;
}
.sid-chip .lbl { font-size: 0.6rem; color: var(--c-t3); white-space: nowrap; }
.sid-chip .val { font-family: monospace; font-size: 0.68rem; color: var(--c-primary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Field tracker */
.f-section-hdr {
  font-size: 0.63rem; color: var(--c-t3); font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em;
  margin: 10px 0 5px;
}
.f-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 6px; border-radius: 7px;
  transition: background .15s; cursor: default;
}
.f-item:hover { background: var(--c-s2); }
.f-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: var(--c-t3); border: 1.5px solid var(--c-t3);
  transition: background .3s, border-color .3s, box-shadow .3s;
}
.f-dot.done { background: var(--c-green); border-color: var(--c-green); box-shadow: 0 0 6px rgba(34,197,94,.4); }
.f-dot.req  { background: transparent; border-color: var(--c-s3); }
.f-name  { font-size: 0.72rem; color: var(--c-t2); flex: 1; min-width: 0; }
.f-val   { font-size: 0.65rem; color: var(--c-primary); max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.f-star  { font-size: 0.6rem; color: var(--c-primary); opacity: .6; }

/* ── CENTER ───────────────────────────────────────────── */
.center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 28px;
  position: relative;
  overflow: hidden;
}
.center::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 40%, rgba(29,95,168,.1) 0%, transparent 65%);
  pointer-events: none;
}

/* Orb */
.orb-area {
  position: relative;
  width: 220px; height: 220px;
  display: flex; align-items: center; justify-content: center;
}
.ring {
  position: absolute;
  border-radius: 50%;
  border: 1.5px solid rgba(29,95,168,.18);
  animation: ring-idle 4s ease-in-out infinite;
  transition: border-color .5s;
}
.ring:nth-child(1) { width: 180px; height: 180px; animation-delay: 0s; }
.ring:nth-child(2) { width: 210px; height: 210px; animation-delay: .6s; }
.ring:nth-child(3) { width: 240px; height: 240px; animation-delay: 1.2s; }
@keyframes ring-idle { 0%,100%{opacity:.6; transform:scale(1)} 50%{opacity:.2; transform:scale(1.015)} }

.orb-area.listening .ring { border-color: rgba(34,197,94,.35); animation: ring-out 1.4s ease-out infinite; }
@keyframes ring-out { 0%{opacity:.9; transform:scale(1)} 100%{opacity:0; transform:scale(1.5)} }
.orb-area.listening .ring:nth-child(2) { animation-delay: .35s; }
.orb-area.listening .ring:nth-child(3) { animation-delay: .7s; }

.orb-area.speaking .ring  { border-color: rgba(129,140,248,.4); animation: ring-out .9s ease-out infinite; }
.orb-area.speaking .ring:nth-child(2) { animation-delay: .2s; }
.orb-area.speaking .ring:nth-child(3) { animation-delay: .4s; }

.orb {
  position: relative; z-index: 2;
  width: 144px; height: 144px; border-radius: 50%;
  background: radial-gradient(circle at 38% 30%, #3B82F6, var(--c-primary) 55%, #0D2F6E 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.07),
    0 4px 20px rgba(29,95,168,.5),
    0 0 70px rgba(29,95,168,.2),
    inset 0 1px 1px rgba(255,255,255,.18);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  cursor: pointer;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.orb:hover { transform: scale(1.05); box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 6px 28px rgba(29,95,168,.6), 0 0 90px rgba(29,95,168,.3), inset 0 1px 1px rgba(255,255,255,.18); }

.orb-area.listening .orb {
  background: radial-gradient(circle at 38% 30%, #4ADE80, #16A34A 55%, #064E3B 100%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 4px 20px rgba(34,197,94,.45), 0 0 70px rgba(34,197,94,.2), inset 0 1px 1px rgba(255,255,255,.18);
  animation: pulse-listen 2s ease-in-out infinite;
}
@keyframes pulse-listen { 0%,100%{transform:scale(1)} 50%{transform:scale(1.025)} }
.orb-area.speaking .orb {
  background: radial-gradient(circle at 38% 30%, #C7D2FE, #818CF8 55%, #312E81 100%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 4px 20px rgba(129,140,248,.5), 0 0 80px rgba(129,140,248,.25), inset 0 1px 1px rgba(255,255,255,.2);
  animation: pulse-speak .75s ease-in-out infinite;
}
@keyframes pulse-speak { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }

.orb-icon { width: 34px; height: 34px; }
.orb-label { font-size: 0.62rem; color: rgba(255,255,255,.65); letter-spacing: .04em; font-weight: 500; }

/* Waveform */
#waveform { border-radius: 10px; }

/* Timer + status */
.timer { font-size: 1.2rem; font-weight: 300; color: var(--c-t2); font-variant-numeric: tabular-nums; letter-spacing: .06em; }
.vstatus { font-size: 0.78rem; color: var(--c-t3); text-align: center; min-height: 20px; }

.cta-row { display: flex; gap: 10px; }
.cta-row .btn { width: auto; padding: 8px 20px; font-size: 0.75rem; }

/* ── RIGHT: TRANSCRIPT ────────────────────────────────── */
.right {
  background: var(--c-surface);
  border-left: 1px solid var(--c-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.r-hdr {
  padding: 14px 16px;
  border-bottom: 1px solid var(--c-border);
  display: flex; align-items: center; justify-content: space-between;
}
.r-hdr-label { font-size: 0.63rem; text-transform: uppercase; letter-spacing: .09em; color: var(--c-t3); font-weight: 700; }
.r-hdr-clear { background: none; border: none; color: var(--c-t3); cursor: pointer; font-size: 0.7rem; padding: 3px 8px; border-radius: 5px; }
.r-hdr-clear:hover { background: var(--c-s2); color: var(--c-t2); }

.transcript {
  flex: 1;
  overflow-y: auto;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--c-s3) transparent;
}
.transcript::-webkit-scrollbar { width: 4px; }
.transcript::-webkit-scrollbar-thumb { background: var(--c-s3); border-radius: 4px; }

.msg      { display: flex; flex-direction: column; max-width: 87%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.agent{ align-self: flex-start; align-items: flex-start; }
.msg-who  { font-size: 0.62rem; color: var(--c-t3); margin-bottom: 3px; padding: 0 5px; }
.msg-bub  {
  padding: 9px 13px;
  border-radius: 16px;
  font-size: 0.78rem; line-height: 1.55;
  word-break: break-word;
  white-space: pre-wrap;
}
.msg.user  .msg-bub { background: var(--c-primary); color: #fff; border-bottom-right-radius: 5px; }
.msg.agent .msg-bub { background: var(--c-s3); color: var(--c-t1); border-bottom-left-radius: 5px; border: 1px solid var(--c-border); }

.pill {
  align-self: center;
  font-size: 0.62rem; color: var(--c-t3);
  background: var(--c-s2); border: 1px solid var(--c-border);
  padding: 2px 10px; border-radius: 20px;
  display: flex; align-items: center; gap: 5px;
}
.pill.ok    { color: var(--c-teal);   border-color: rgba(29,158,117,.3); background: rgba(29,158,117,.08); }
.pill.bad   { color: var(--c-red);    border-color: rgba(239,68,68,.3);  background: rgba(239,68,68,.08); }
.pill.warn  { color: var(--c-amber);  border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.08); }
.pill::before { content: '·'; font-size: .9rem; line-height: 1; }
.pill.ok::before  { color: var(--c-green); }
.pill.bad::before { color: var(--c-red);   }

.txt-row {
  padding: 11px 12px;
  border-top: 1px solid var(--c-border);
  display: flex; gap: 8px;
}
.txt-row input {
  flex: 1;
  background: var(--c-s2); border: 1px solid var(--c-border);
  color: var(--c-t1); border-radius: 10px;
  padding: 9px 13px; font-size: 0.78rem; outline: none;
}
.txt-row input:focus { border-color: var(--c-primary); }
.txt-row input::placeholder { color: var(--c-t3); }
.txt-row input:disabled { opacity: .4; }
.send-btn {
  background: var(--c-primary); border: none;
  border-radius: 10px; padding: 9px 16px;
  cursor: pointer; color: #fff; font-size: 0.78rem; font-weight: 600;
  transition: opacity .15s;
}
.send-btn:disabled { opacity: .35; cursor: not-allowed; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="logo-mark">S</div>
  <div>
    <div class="logo-name">SENA</div>
    <div class="logo-sub">Voice Onboarding Harness</div>
  </div>
  <div class="hdr-div"></div>
  <div class="step-pill" id="step-pill">Select step</div>
  <div class="hdr-right">
    <div class="status-dot" id="hdot"></div>
    <span class="status-label" id="hlabel">Disconnected</span>
  </div>
</header>

<div class="body">

  <!-- LEFT -->
  <aside class="left">
    <div class="s-section">
      <div class="s-label">Session</div>
      <div class="f-group">
        <label>API Base URL</label>
        <input id="base-url" value="http://127.0.0.1:8089" />
      </div>
      <div class="f-group">
        <label>Participant ID</label>
        <input id="participant-id" value="test-participant-001" />
      </div>
      <div class="f-group">
        <label>Step</label>
        <div class="sel-wrap">
          <select id="step-id" onchange="onStepChange()">
            <option value="personal_information">Personal Information</option>
            <option value="participant_requirements">Participant Requirements</option>
            <option value="ndis_plan_details">NDIS Plan Details</option>
            <option value="medical_information">Medical Information</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-create" onclick="createSession()">Create Session</button>
      <div class="sid-chip" id="sid-chip">
        <span class="lbl">SID</span>
        <span class="val" id="sid-val"></span>
      </div>
    </div>
    <div class="s-section grow">
      <div class="s-label">Fields</div>
      <div id="field-list"></div>
    </div>
  </aside>

  <!-- CENTER -->
  <section class="center">
    <div class="orb-area" id="orb-area">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="orb" id="orb" onclick="toggleSession()">
        <!-- mic icon -->
        <svg class="orb-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="13" y="4" width="10" height="16" rx="5" fill="white" fill-opacity=".9"/>
          <path d="M7 18c0 6.075 4.925 11 11 11s11-4.925 11-11" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none" fill-opacity=".9"/>
          <line x1="18" y1="29" x2="18" y2="33" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="13" y1="33" x2="23" y2="33" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="orb-label" id="orb-label">Tap to start</span>
      </div>
    </div>

    <canvas id="waveform" width="340" height="56"></canvas>

    <div class="timer" id="timer">00:00</div>
    <div class="vstatus" id="vstatus">Create a session to begin</div>

    <div class="cta-row">
      <button class="btn btn-ghost" id="btn-stop" disabled onclick="stopSession()">Stop</button>
      <button class="btn btn-ghost" onclick="clearTranscript()">Clear log</button>
    </div>
  </section>

  <!-- RIGHT -->
  <aside class="right">
    <div class="r-hdr">
      <span class="r-hdr-label">Transcript</span>
      <button class="r-hdr-clear" onclick="clearTranscript()">Clear</button>
    </div>
    <div class="transcript" id="transcript"></div>
    <div class="txt-row">
      <input id="txt-in" placeholder="Type a message — Enter to send" disabled />
      <button class="send-btn" id="btn-send" disabled onclick="sendText()">Send</button>
    </div>
  </aside>

</div>

<script>
'use strict';

// ─── State ────────────────────────────────────────────────────────────────────
let sessionId = null, wsUrl = null, ws = null;
let captureCtx = null, mediaStream = null, scriptNode = null, sourceNode = null;
let playbackCtx = null, pbAt = 0;
let agentSpeaking = false;
let micRms = 0;
let sessionStart = null;
let timerIv = null;
const PB_SR = 24000;

// ─── Schemas ─────────────────────────────────────────────────────────────────
const SCHEMAS = {
  personal_information: {
    version:'v1', step_id:'personal_information',
    step_label:'Personal Information', progress_percent:20,
    sections:[
      { id:'basics', label:'About you', fields:[
        {id:'full_name',           type:'text',    label:'Full Name',           required:true},
        {id:'email',               type:'email',   label:'Email Address',       required:true},
        {id:'phone',               type:'phone',   label:'Phone Number',        required:true},
        {id:'date_of_birth',       type:'date',    label:'Date of Birth',       required:true},
        {id:'gender',              type:'enum',    label:'Gender',              required:true,
          options:['Male','Female','Non-binary','Prefer not to say','Other']},
        {id:'preferred_language',  type:'text',    label:'Preferred Language',  required:true},
        {id:'interpreter_required',type:'boolean', label:'Interpreter Required',required:true}
      ]},
      { id:'home_address', label:'Home Address', fields:[
        {id:'address', type:'text', label:'Street Address', required:true},
        {id:'state',   type:'enum', label:'State',          required:true,
          options:['NSW','VIC','QLD','WA','SA','TAS','ACT','NT']},
        {id:'city',    type:'text', label:'City / Suburb',  required:true},
        {id:'zip_code',type:'text', label:'Postcode',       required:true}
      ]},
      { id:'emergency_contacts', label:'Emergency Contacts',
        item_fields:[
          {id:'name',        type:'text',  label:'Name',        required:true},
          {id:'relationship',type:'text',  label:'Relationship',required:true},
          {id:'phone',       type:'phone', label:'Phone',       required:true}
        ], repeatable:{min:1,max:5}
      }
    ]
  },
  participant_requirements: {
    version:'v1', step_id:'participant_requirements',
    step_label:'Participant Requirements', progress_percent:40,
    sections:[{ id:'requirements', label:'Requirements', fields:[
      {id:'cultural_background',       type:'text',       label:'Cultural Background',       required:false},
      {id:'communication_preferences', type:'multi_enum', label:'Communication Preferences', required:true,
        options:['Verbal','Written','Sign language','Phone','Video call','Email']},
      {id:'support_goals',             type:'textarea',   label:'Support Goals',             required:true}
    ]}]
  },
  ndis_plan_details: {
    version:'v1', step_id:'ndis_plan_details',
    step_label:'NDIS Plan Details', progress_percent:60,
    sections:[{ id:'plan_info', label:'Plan Info', fields:[
      {id:'ndis_number',    type:'text', label:'NDIS Number',     required:true},
      {id:'plan_start_date',type:'date', label:'Plan Start Date', required:true},
      {id:'plan_end_date',  type:'date', label:'Plan End Date',   required:true},
      {id:'plan_management',type:'enum', label:'Plan Management', required:true,
        options:['Self managed','Plan managed','Agency managed','Combination']}
    ]}]
  },
  medical_information: {
    version:'v1', step_id:'medical_information',
    step_label:'Medical Information', progress_percent:80,
    sections:[{ id:'medical', label:'Medical', fields:[
      {id:'primary_diagnosis',type:'text',     label:'Primary Diagnosis',required:true},
      {id:'allergies',        type:'textarea', label:'Allergies',        required:false}
    ]}]
  }
};

// ─── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  onStepChange();
  document.getElementById('txt-in').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
  });
  startWaveLoop();
});

function onStepChange() {
  const id = document.getElementById('step-id').value;
  const s = SCHEMAS[id];
  document.getElementById('step-pill').textContent = s.step_label;
  buildFieldList(s);
}

// ─── Field list ───────────────────────────────────────────────────────────────
function buildFieldList(schema) {
  const root = document.getElementById('field-list');
  while (root.firstChild) root.removeChild(root.firstChild);

  schema.sections.forEach(sec => {
    const fields = sec.fields || sec.item_fields || [];
    if (!fields.length) return;

    const hdr = document.createElement('div');
    hdr.className = 'f-section-hdr';
    hdr.textContent = sec.label;
    root.appendChild(hdr);

    fields.forEach(f => {
      const key = sec.id + '.' + f.id;
      const row = document.createElement('div');
      row.className = 'f-item';
      row.id = 'frow-' + key.replace(/\./g,'-');

      const dot = document.createElement('div');
      dot.id = 'fdot-' + key.replace(/\./g,'-');
      dot.className = 'f-dot ' + (f.required ? 'req' : '');

      const nm = document.createElement('div');
      nm.className = 'f-name';
      nm.textContent = f.label;

      row.appendChild(dot);
      row.appendChild(nm);

      if (f.required) {
        const star = document.createElement('span');
        star.className = 'f-star';
        star.textContent = '★';
        row.appendChild(star);
      }

      const vd = document.createElement('div');
      vd.className = 'f-val';
      vd.id = 'fval-' + key.replace(/\./g,'-');
      row.appendChild(vd);
      root.appendChild(row);
    });
  });
}

function markField(section, field, value) {
  const k = (section + '.' + field).replace(/\./g,'-');
  const dot = document.getElementById('fdot-' + k);
  const val = document.getElementById('fval-' + k);
  if (dot) { dot.className = 'f-dot done'; }
  if (val) { val.textContent = String(Array.isArray(value) ? value.join(', ') : value).slice(0,16); }
}

// ─── Header status ────────────────────────────────────────────────────────────
function setHdr(text, state) {
  document.getElementById('hdot').className   = 'status-dot ' + (state||'');
  document.getElementById('hlabel').textContent = text;
}

// ─── Orb state ────────────────────────────────────────────────────────────────
function setOrb(state, label) {
  document.getElementById('orb-area').className = 'orb-area ' + (state||'');
  if (label !== undefined) document.getElementById('orb-label').textContent = label;
}

function setVStatus(text) { document.getElementById('vstatus').textContent = text; }

// ─── Timer ────────────────────────────────────────────────────────────────────
function startTimer() {
  sessionStart = Date.now();
  timerIv = setInterval(() => {
    const s = Math.floor((Date.now()-sessionStart)/1000);
    document.getElementById('timer').textContent =
      String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }, 500);
}
function stopTimer() {
  clearInterval(timerIv); timerIv = null;
  document.getElementById('timer').textContent = '00:00';
}

// ─── Transcript ───────────────────────────────────────────────────────────────
function addMsg(text, who) {
  const t = document.getElementById('transcript');
  const w = document.createElement('div'); w.className = 'msg ' + who;
  const lbl = document.createElement('div'); lbl.className = 'msg-who';
  lbl.textContent = who === 'user' ? 'You' : 'Sena';
  const b = document.createElement('div'); b.className = 'msg-bub';
  b.textContent = text;
  w.appendChild(lbl); w.appendChild(b);
  t.appendChild(w); t.scrollTop = t.scrollHeight;
}

function addPill(text, cls) {
  const t = document.getElementById('transcript');
  const p = document.createElement('div'); p.className = 'pill ' + (cls||'');
  p.textContent = text;
  t.appendChild(p); t.scrollTop = t.scrollHeight;
}

function clearTranscript() {
  const t = document.getElementById('transcript');
  while (t.firstChild) t.removeChild(t.firstChild);
}

// ─── Create session ───────────────────────────────────────────────────────────
async function createSession() {
  const base = document.getElementById('base-url').value.replace(/\/$/,'');
  const pid  = document.getElementById('participant-id').value.trim();
  const step = document.getElementById('step-id').value;

  addPill('Creating session…');
  document.getElementById('btn-create').disabled = true;
  try {
    const r = await fetch(base + '/v1/onboarding/session', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({participant_id:pid, step, schema:SCHEMAS[step]})
    });
    if (!r.ok) throw new Error(r.status + ' ' + await r.text());
    const d = await r.json();
    sessionId = d.session_id;
    wsUrl = d.ws_url;
    const chip = document.getElementById('sid-chip');
    chip.style.display = 'flex';
    document.getElementById('sid-val').textContent = sessionId;
    document.getElementById('btn-create').textContent = 'New Session';
    document.getElementById('btn-create').disabled = false;
    addPill('Session ready', 'ok');
    setVStatus('Tap the orb to connect');
    setOrb('', 'Tap to start');
  } catch(e) {
    addPill('Error: ' + e.message, 'bad');
    document.getElementById('btn-create').disabled = false;
  }
}

// ─── Toggle / connect ─────────────────────────────────────────────────────────
function toggleSession() {
  if (!sessionId) { addPill('Create a session first', 'bad'); return; }
  if (ws && ws.readyState === WebSocket.OPEN) { stopSession(); return; }
  connectWs();
}

async function connectWs() {
  if (!wsUrl) return;
  setHdr('Connecting…', 'connecting');
  setOrb('', 'Connecting…');
  setVStatus('Opening WebSocket…');

  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';

  ws.addEventListener('open', async () => {
    ws.send(JSON.stringify({type:'start'}));
    await startMic();
    setHdr('Live', 'live');
    setOrb('listening', 'Listening');
    setVStatus('Speak to Sena…');
    document.getElementById('btn-stop').disabled = false;
    document.getElementById('txt-in').disabled = false;
    document.getElementById('btn-send').disabled = false;
    addPill('Connected — say hello!', 'ok');
    startTimer();
  });

  ws.addEventListener('message', ev => {
    if (ev.data instanceof ArrayBuffer) enqueueAudio(ev.data);
    else handleEvent(ev.data);
  });

  ws.addEventListener('error', () => {
    setHdr('Error', 'error'); setOrb('', 'Error');
    setVStatus('Connection failed');
    addPill('WebSocket error', 'bad');
  });

  ws.addEventListener('close', ev => {
    setHdr('Disconnected', ''); setOrb('', 'Tap to start');
    setVStatus('Session ended');
    stopMic(); stopTimer();
    document.getElementById('btn-stop').disabled = true;
    document.getElementById('txt-in').disabled = true;
    document.getElementById('btn-send').disabled = true;
    if (ev.code >= 4000) addPill('Closed ' + ev.code + ' ' + (ev.reason||''), 'bad');
    else addPill('Session closed');
  });
}

// ─── Event handler ────────────────────────────────────────────────────────────
function handleEvent(raw) {
  let ev;
  try { ev = JSON.parse(raw); } catch(_) { return; }

  switch(ev.type) {
    case 'ready':
      addPill('Session live', 'ok');
      break;
    case 'turn_start':
      agentSpeaking = true;
      setOrb('speaking', 'Speaking');
      setHdr('Sena speaking', 'speaking');
      setVStatus('Sena is speaking…');
      if (ws && ws.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({type:'audio_end'}));
      break;
    case 'turn_complete':
      agentSpeaking = false;
      setOrb('listening', 'Listening');
      setHdr('Live', 'live');
      setVStatus('Speak to Sena…');
      break;
    case 'interrupted':
      agentSpeaking = false; pbAt = 0;
      setOrb('listening', 'Listening');
      setHdr('Live', 'live');
      setVStatus('Speak to Sena…');
      break;
    case 'user_said':
      addMsg(ev.text, 'user');
      break;
    case 'agent_said':
      addMsg(ev.text, 'agent');
      break;
    case 'field_updated':
      markField(ev.section, ev.field, ev.value);
      addPill(ev.section + '.' + ev.field + ' saved', 'ok');
      break;
    case 'row_added':
      addPill('New row: ' + ev.section_id + ' #' + (ev.new_index+1), 'ok');
      break;
    case 'step_completed':
      addPill('Step complete ✓', 'ok');
      setVStatus('Step complete!');
      break;
    case 'validation_rejection':
      addPill(ev.section_id + '.' + (ev.field_id||'?') + ': ' + ev.reason_human, 'bad');
      break;
    case 'error':
      addPill('[' + ev.code + '] ' + ev.message, 'bad');
      break;
    case 'go_away':
      addPill('Session expires in ' + Math.round(ev.time_left_ms/1000) + 's — reconnect soon', 'bad');
      break;
    case 'resumable':
      addPill('Resume handle issued (ttl ' + ev.ttl_sec + 's)');
      break;
    default:
      addPill(ev.type);
  }
}

// ─── Mic capture → PCM16 16kHz ────────────────────────────────────────────────
async function startMic() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio:{sampleRate:16000, channelCount:1, echoCancellation:true, noiseSuppression:true}
    });
  } catch(e) { addPill('Mic error: ' + e.message, 'bad'); return; }

  captureCtx = new AudioContext({sampleRate:16000});
  sourceNode = captureCtx.createMediaStreamSource(mediaStream);
  scriptNode = captureCtx.createScriptProcessor(512, 1, 1);
  scriptNode.onaudioprocess = function(ev) {
    const s = ev.inputBuffer.getChannelData(0);
    let sum = 0;
    for (let i=0;i<s.length;i++) sum += s[i]*s[i];
    micRms = Math.sqrt(sum/s.length);
    if (agentSpeaking || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(toPcm16(s));
  };
  sourceNode.connect(scriptNode);
  scriptNode.connect(captureCtx.destination);
}

function stopMic() {
  if (scriptNode)  { try{scriptNode.disconnect();}catch(_){}  scriptNode=null; }
  if (sourceNode)  { try{sourceNode.disconnect();}catch(_){}  sourceNode=null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
  if (captureCtx)  { captureCtx.close(); captureCtx=null; }
  micRms=0; agentSpeaking=false;
}

function toPcm16(f32) {
  const b = new ArrayBuffer(f32.length*2);
  const v = new DataView(b);
  for (let i=0;i<f32.length;i++) {
    const c = Math.max(-1, Math.min(1, f32[i]));
    v.setInt16(i*2, c<0 ? c*0x8000 : c*0x7FFF, true);
  }
  return b;
}

// ─── Playback PCM16 24kHz ─────────────────────────────────────────────────────
function enqueueAudio(buf) {
  if (!playbackCtx) playbackCtx = new AudioContext({sampleRate:PB_SR});
  const n = buf.byteLength/2;
  const f32 = new Float32Array(n);
  const v = new DataView(buf);
  for (let i=0;i<n;i++) f32[i] = v.getInt16(i*2,true)/32768;
  const ab = playbackCtx.createBuffer(1,n,PB_SR);
  ab.copyToChannel(f32,0);
  const src = playbackCtx.createBufferSource();
  src.buffer = ab; src.connect(playbackCtx.destination);
  const now = playbackCtx.currentTime;
  const at = Math.max(now, pbAt);
  src.start(at); pbAt = at + ab.duration;
}

// ─── Waveform ─────────────────────────────────────────────────────────────────
const HIST = 68;
const hist = new Float32Array(HIST);
let hPtr = 0;

function startWaveLoop() {
  const canvas = document.getElementById('waveform');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const barW = 3, gap = 2, stride = barW+gap;
  const bars = Math.floor(W/stride);
  const cy = H/2;

  (function draw() {
    requestAnimationFrame(draw);
    hist[hPtr % HIST] = micRms;
    hPtr++;
    ctx.clearRect(0,0,W,H);
    const active = ws && ws.readyState === WebSocket.OPEN;
    const r = agentSpeaking ? [129,140,248] : (active ? [34,197,94] : [29,95,168]);

    for (let i=0;i<bars;i++) {
      const idx = (hPtr - bars + i + HIST*10) % HIST;
      const rms = hist[idx];
      const wave = Math.sin(i * 0.38 + hPtr * 0.11) * (active ? rms*25+1 : 1.5);
      const h = active ? Math.max(2, rms*160 + Math.abs(wave) + 2) : 2.5;
      const x = i*stride;
      const alpha = active ? (0.25 + (i/bars)*0.75) : (0.1 + (i/bars)*0.2);
      ctx.fillStyle = 'rgba('+r[0]+','+r[1]+','+r[2]+','+alpha.toFixed(2)+')';
      const y = cy - h/2;
      // manual rounded rect (compat)
      const radius = Math.min(1.5, h/2);
      ctx.beginPath();
      ctx.moveTo(x+radius, y);
      ctx.lineTo(x+barW-radius, y);
      ctx.arcTo(x+barW, y, x+barW, y+radius, radius);
      ctx.lineTo(x+barW, y+h-radius);
      ctx.arcTo(x+barW, y+h, x+barW-radius, y+h, radius);
      ctx.lineTo(x+radius, y+h);
      ctx.arcTo(x, y+h, x, y+h-radius, radius);
      ctx.lineTo(x, y+radius);
      ctx.arcTo(x, y, x+radius, y, radius);
      ctx.closePath();
      ctx.fill();
    }
  })();
}

// ─── Send text ────────────────────────────────────────────────────────────────
function sendText() {
  const inp = document.getElementById('txt-in');
  const text = inp.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({type:'user_text', text}));
  addMsg(text, 'user');
  inp.value = '';
}

// ─── Stop ─────────────────────────────────────────────────────────────────────
function stopSession() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type:'stop'}));
    ws.close(1000,'User stopped');
  }
  stopMic();
  if (playbackCtx) { playbackCtx.close(); playbackCtx=null; }
  pbAt=0;
}
