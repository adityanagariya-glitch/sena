# Alembic Configuration File
# Configures the Alembic database migration tool
#
# Purpose: Manages database schema versioning and migrations
# - script_location: Path to migration scripts (migrations folder)
# - sqlalchemy.url: PostgreSQL connection string for local development
# 
# Sections:
# - [alembic]: Core configuration
# - [loggers]: Logging configuration for alembic, sqlalchemy, root logger
# - [handlers]: Console output handler
# - [formatters]: Log message formatting
#
# Key functions:
# - Tracks applied migrations in alembic_version table
# - Generates migration files when database schema changes
# - Supports async SQLAlchemy with asyncpg driver
# - Used with 'make migrate' command
