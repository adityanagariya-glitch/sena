map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name dev-api.isena.org;

    access_log /var/log/nginx/dev-api.isena.org_access.log;
    error_log  /var/log/nginx/dev-api.isena.org_error.log;

    # Main app (port 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Case review service (port 8084)
    location /sena-rp/ {
        proxy_pass http://127.0.0.1:8084/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Onboarding service (port 8083) — REST + WebSocket
    location /sena-ob/ {
        proxy_pass http://127.0.0.1:8083/;

        # Required for WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout — voice WS sessions go silent between turns
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;

        # Max upload size for profile pics, incident media, signed docs (all cap at 5MB)
        client_max_body_size 6m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/dev-api.isena.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev-api.isena.org/privkey.pem;   # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;               # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                     # managed by Certbot
}

server {
    if ($host = dev-api.isena.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name dev-api.isena.org;
    return 404; # managed by Certbot
}
